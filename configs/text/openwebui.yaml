title: Open WebUI
name: openwebui
use_python: true
python_version: "3.11"
expose: true
port: 7021


prepare_env: |-
  $UV_INSTALL_DIR/uv pip install -U open-webui

action_before_start: |-

start: |-
  PYTHONUNBUFFERED=1 service_loop "uvx --python $VENV_DIR/{{ name }}-env/bin/python open-webui serve --port {{ port }}" > $LOG_DIR/{{ name }}.log 2>&1 &
  echo $! > /tmp/{{ name }}.pid

custom_start: ""
custom_reload: ""
custom_stop: ""

export_required_env: ""
setup_env: |-
  export MODEL_DIR=${{ '{' ~ name|upper }}_MODEL_DIR:-"$DATA_DIR/llm-models"}

  export {{ name|upper }}_PORT={{ port }}

  export EXPOSE_PORTS="$EXPOSE_PORTS:${{ name|upper }}_PORT"
  export PORT_MAPPING="$PORT_MAPPING:{{ name }}"

  export DATA_DIR=$ROOT_REPO_DIR/settings/{{ name }}
