title: Ollama
name: ollama
use_python: false
expose: true
port: 11434


prepare_env: |-
  if [[ -d /usr/lib/ollama ]]; then
    rm -rf /usr/lib/ollama
  fi

  curl -L -o /tmp/ollama-linux-amd64.tgz https://ollama.com/download/ollama-linux-amd64.tgz
  tar -C /usr -xzf /tmp/ollama-linux-amd64.tgz

action_before_start: |-

start: |-
  PYTHONUNBUFFERED=1 service_loop "/usr/bin/ollama serve" > $LOG_DIR/{{ name }}.log 2>&1 &
  echo $! > /tmp/{{ name }}.pid

download_model: |-
  IFS=',' read -ra ollama_model_list <<< "$OLLAMA_MODEL_LIST"
  ollama_args=""
  if [[ -n "$OLLAMA_USE_INSECURE" ]]; then
    ollama_args="--insecure"
  fi
  for model in "${ollama_model_list[@]}"
  do
    ollama pull "$model" $ollama_args
  done

custom_start: ""
custom_reload: ""
custom_stop: ""

export_required_env: ""
setup_env: |-
  export MODEL_DIR=${{ '{' ~ name|upper }}_MODEL_DIR:-"$DATA_DIR/llm-models"}
  export OLLAMA_MODELS=$MODEL_DIR

  export {{ name|upper }}_PORT={{ port }}
  export OLLAMA_HOST=0.0.0.0:{{ port }}

  export EXPOSE_PORTS="$EXPOSE_PORTS:${{ name|upper }}_PORT"
  export PORT_MAPPING="$PORT_MAPPING:{{ name }}"


