title: ComfyUI
name: comfyui
use_python: true
python_version: "3.13"
expose: true
port: 7005

prepare_env: |-
  python $WORKING_DIR/utils/create_symlinks.py $current_dir/folder_mapping.json $MODEL_DIR $REPO_DIR/models

  $UV_INSTALL_DIR/uv pip install comfy-cli

  $UV_INSTALL_DIR/uv pip install torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cu130

  comfy --workspace=$ROOT_REPO_DIR --skip-prompt install --nvidia

download_model: |-
  bash $WORKING_DIR/utils/sd_model_download/main.sh

action_before_start: ""

start: |-
  cd "$REPO_DIR"
  mkdir -p $ROOT_REPO_DIR/settings/{{ name }}
  PYTHONUNBUFFERED=1 service_loop "python main.py --dont-print-server --port ${{ name|upper }}_PORT --user-directory $ROOT_REPO_DIR/settings/{{ name }} ${EXTRA_{{ name|upper }}_ARGS}" > $LOG_DIR/{{ name }}.log 2>&1 &
  echo $! > /tmp/{{ name }}.pid

export_required_env: ""
setup_env: |-
  export MODEL_DIR="$DATA_DIR/models"
  export REPO_DIR="$ROOT_REPO_DIR/ComfyUI"

  export {{ name|upper }}_PORT="{{ port }}"
  export EXPOSE_PORTS="$EXPOSE_PORTS:${{ name|upper }}_PORT"
  export PORT_MAPPING="$PORT_MAPPING:{{ name }}"
  export HUGGINGFACE_TOKEN=$HF_TOKEN

extra_files:
  folder_mapping.json: |-
    {
      "checkpoints": "StableDiffusion",
      "vae": "VAE",
      "loras": [
        "Lora",
        "LyCORIS"
      ],
      "upscale_models": [
        "ESRGAN",
        "RealESRGAN",
        "SwinIR"
      ],
      "embeddings": "TextualInversion",
      "hypernetworks": "Hypernetwork",
      "controlnet": [
        "ControlNet",
        "T2IAdapter"
      ],
      "text_encoders": "TextEncoder",
      "clip_vision": "InvokeClipVision",
      "diffusers": "Diffusers",
      "gligen": "GLIGEN",
      "vae_approx": "ApproxVAE",
      "ipadapter": 
        {
          "base": "IpAdapter",
          "sd15": "InvokeIpAdapters15",
          "sdxl": "InvokeIpAdaptersXl"
        },
      "prompt_expansion": "PromptExpansion",
      "ultralytics": "Ultralytics",
      "sams": "Sams",
      "diffusion_models": "Unet"
    }

  