title: Stable Diffusion Comfy
name: sd_comfy
use_python: true
python_version: 3.12
expose: true
port: 7005

prepare_repo: |-

  TARGET_REPO_URL="https://github.com/comfyanonymous/ComfyUI.git" \
  TARGET_REPO_DIR=$REPO_DIR \
  UPDATE_REPO=${{ name|upper }}_UPDATE_REPO \
  UPDATE_REPO_COMMIT=${{ name|upper }}_UPDATE_REPO_COMMIT \
  prepare_repo 

prepare_env: |-
  python $WORKING_DIR/utils/create_symlinks.py $current_dir/folder_mapping.yaml $MODEL_DIR $REPO_DIR/models

  cd $REPO_DIR
  pip install torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cu126
  pip install -r requirements.txt

  cd "$REPO_DIR/custom_nodes"
  if [[ ! -d "comfyui-manager" ]]; then
    git clone https://github.com/ltdrdata/ComfyUI-Manager comfyui-manager
  fi

download_model: |-
  bash $WORKING_DIR/utils/sd_model_download/main.sh

action_before_start: ""

start: |-
  cd "$REPO_DIR"
  PYTHONUNBUFFERED=1 service_loop "python main.py --dont-print-server --highvram --port ${{ name|upper }}_PORT ----user-directory $ROOT_REPO_DIR/settings ${EXTRA_{{ name|upper }}_ARGS}" > $LOG_DIR/{{ name }}.log 2>&1 &
  echo $! > /tmp/{{ name }}.pid

export_required_env: ""
setup_env: |-
  export MODEL_DIR="$DATA_DIR/models"
  export REPO_DIR="$ROOT_REPO_DIR/ComfyUI"

  export {{ name|upper }}_PORT="{{ port }}"
  export EXPOSE_PORTS="$EXPOSE_PORTS:${{ name|upper }}_PORT"
  export PORT_MAPPING="$PORT_MAPPING:{{ name }}"
  export HUGGINGFACE_TOKEN=$HF_TOKEN